apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
      tier: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: httpd
          image: httpd:IMAGE_TAG
          command: ["/bin/sh", "-c"]
          args:
            - sed "s/{{HOSTNAME}}/$HOSTNAME/g" /tmp/data/index.html > /usr/local/apache2/htdocs/index.html && httpd-foreground
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: html-data
              mountPath: /tmp/data
      volumes:
        - name: html-data
          configMap:
            name: frontend-html
